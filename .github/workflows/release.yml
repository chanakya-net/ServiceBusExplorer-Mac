name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.0)'
        required: true

permissions:
  # Needed to create the release and upload the .dmg / .zip assets.
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-14

    strategy:
      # One architecture failing shouldn't discard the other's finished build.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runtime: osx-arm64
            label: Apple Silicon
          - arch: x64
            runtime: osx-x64
            label: Intel

    outputs:
      # Tells the publish job which install instructions to write.
      signed: ${{ steps.signing.outputs.enabled }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # A tagged build that ships failing code is worse than no build at all.
      - name: Test
        run: dotnet test --configuration Release

      - name: Build .app
        run: ./build/make-app.sh ${{ matrix.runtime }}

      # ── Developer ID signing, only when the secrets are configured ──────────────
      #
      # Secrets cannot be used in an `if:` expression directly, so presence is resolved
      # into a step output first. With no secrets set, every signing step below is
      # skipped and the ad-hoc signature from make-app.sh ships as-is.
      - name: Check for signing credentials
        id: signing
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing is configured — the release will be notarized."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — shipping ad-hoc signed builds."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral: the keychain lives only for this job, on a throwaway runner.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"

          # Without this, codesign blocks on a GUI prompt for keychain access and the
          # job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it first in the search list so codesign finds the identity.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

      - name: Sign and notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./build/sign-and-notarize.sh artifacts/SB-Mac.app

      # ── Packaging ──────────────────────────────────────────────────────────────
      - name: Package .dmg and .zip
        run: |
          set -euo pipefail
          mkdir -p dist

          ./build/make-dmg.sh artifacts/SB-Mac.app "dist/SB-Mac-${{ matrix.arch }}.dmg" "SB-Mac"

          # ditto preserves the bundle's symlinks and extended attributes, which a
          # plain `zip` silently mangles and which breaks the code signature.
          ditto -c -k --sequesterRsrc --keepParent \
            artifacts/SB-Mac.app "dist/SB-Mac-${{ matrix.arch }}.zip"

      # The .app inside is already stapled, but the disk image is a separate artifact and
      # gets its own quarantine assessment on mount, so it is notarized too.
      - name: Notarize the disk image
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          DMG="dist/SB-Mac-${{ matrix.arch }}.dmg"

          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$DMG"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 SB-Mac-${{ matrix.arch }}.dmg SB-Mac-${{ matrix.arch }}.zip \
            > SB-Mac-${{ matrix.arch }}.sha256
          cat SB-Mac-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      # Runs even when a previous step failed, so a signing key never outlives the job.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Collect assets
        run: |
          mkdir -p dist
          find staging -type f -exec mv {} dist/ \;
          ls -la dist

      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          Download the `.dmg` for your Mac:

          | Mac | File |
          |---|---|
          | Apple Silicon (M1/M2/M3/M4) | `SB-Mac-arm64.dmg` |
          | Intel | `SB-Mac-x64.dmg` |

          Not sure? Run `uname -m` — `arm64` means Apple Silicon.

          Open the `.dmg` and drag **SB-Mac** to Applications.
          NOTES

          # The quarantine workaround is only correct for ad-hoc builds. A notarized
          # release opens on a double-click, and telling people to strip attributes off a
          # properly signed app would be actively bad advice.
          if [ "$SIGNED" = "true" ]; then
            cat >> notes.md <<'NOTES'

          These builds are signed with a Developer ID and notarized by Apple, so they
          open normally — no quarantine workaround needed.
          NOTES
          else
            cat >> notes.md <<'NOTES'

          ### First launch

          These builds are ad-hoc signed, not signed with an Apple Developer ID.
          macOS quarantines apps downloaded from the internet, so the first launch
          will fail with *"SB-Mac is damaged and can't be opened"* until you clear
          the quarantine flag:

          ```bash
          xattr -dr com.apple.quarantine /Applications/SB-Mac.app
          ```

          Then open it normally. You only need to do this once per install.

          This is a limitation of distributing without a paid Apple Developer
          account, not a sign anything is wrong with the download — verify the
          bytes against the `.sha256` files attached below if you want to be sure.
          NOTES
          fi

          cat >> notes.md <<NOTES

          ### Building it yourself

          A locally built bundle is never quarantined:

          \`\`\`bash
          git clone https://github.com/${{ github.repository }}.git
          cd ServiceBusExplorer-Mac
          ./build/make-app.sh
          open artifacts/SB-Mac.app
          \`\`\`

          Requires the .NET 10 SDK.
          NOTES

          echo "--- release notes ---"
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "SB-Mac ${{ steps.tag.outputs.name }}" \
            --notes-file notes.md \
            dist/*
